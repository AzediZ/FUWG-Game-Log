const statusBox = document.getElementById('status'); const slider = document.getElementById('slider'); const label = document.getElementById('label'); const playBtn = document.getElementById('play');
let idx=0, playing=false, delay=170; const cache=new Map(); let currentToken=0;
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function panel(c,x,y,w,h){c.fillStyle='rgba(8,10,14,.84)'; c.strokeStyle='rgba(255,255,255,.18)'; c.lineWidth=1; roundRect(c,x,y,w,h,16); c.fill(); c.stroke();}
function drawUI(c,snap){c.save(); panel(c,18,18,190,64); c.font='700 16px Arial'; c.fillStyle='rgba(195,195,195,.96)'; c.fillText('CURRENT DATE',30,37); c.font='900 24px Arial'; c.fillStyle='rgba(255,255,255,.98)'; c.fillText(snap.display_date,30,62); panel(c,1192,18,198,56); c.font='700 16px Arial'; c.fillStyle='rgba(195,195,195,.96)'; c.fillText('GAME DATE',1251,38); c.font='900 18px Arial'; c.fillStyle='rgba(255,255,255,.98)'; c.fillText(metadata.gameDate,1230,58); c.textAlign='center'; panel(c,245,18,918,38); c.font='800 18px Arial'; c.fillStyle='rgba(238,238,238,.98)'; c.fillText('Controller-based full-frame renderer',704,43); c.textAlign='left'; c.fillStyle='rgba(8,10,14,.7)'; c.strokeStyle='rgba(255,255,255,.12)'; roundRect(c,18,470,500,32,13); c.fill(); c.stroke(); c.font='900 14px Arial'; c.fillStyle='rgba(220,220,220,.95)'; c.fillText(`Snapshot ${idx+1} / ${metadata.snapshotCount}`,30,491); c.restore(); }
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('Failed to load '+src)); img.src=src;});}
async function getFrame(i){const rel=metadata.snapshots[i].frame; if(cache.has(rel)) return cache.get(rel); const p=loadImage('./assets/'+rel); cache.set(rel,p); return p;}
async function render(){const token=++currentToken; const snap=metadata.snapshots[idx]; statusBox.style.display='flex'; statusBox.textContent='Loading frame…'; try{ const img=await getFrame(idx); if(token!==currentToken) return; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); drawUI(ctx,snap); slider.value=idx; label.textContent=snap.display_date+' · '+snap.game_date; statusBox.style.display='none'; [idx+1,idx+2,idx-1].filter(v=>v>=0&&v<metadata.snapshotCount).forEach(i=>getFrame(i)); }catch(err){ statusBox.innerHTML='Map failed to load.<br><br>'+err.message; console.error(err); } }
function tick(){ if(!playing) return; idx=Math.min(metadata.snapshotCount-1, idx+1); render().then(()=>{ if(idx>=metadata.snapshotCount-1){ playing=false; playBtn.textContent='Play'; return; } setTimeout(tick, delay); }); }
playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?'Pause':'Play'; if(playing) tick(); }; document.getElementById('back').onclick=()=>{ idx=Math.max(0,idx-1); render(); }; document.getElementById('next').onclick=()=>{ idx=Math.min(metadata.snapshotCount-1,idx+1); render(); }; document.getElementById('slow').onclick=()=>delay=260; document.getElementById('fast').onclick=()=>delay=95; slider.oninput=(e)=>{ idx=Number(e.target.value); render(); }; render();
