<script>
const metadata={"width": 1408, "height": 512, "start": "1936-01-01", "end": "1941-06-30", "gameDate": "15/05/2026", "colours": {"axis": [43, 43, 45], "allies": [77, 122, 190], "comintern": [182, 58, 58], "neutral": [104, 110, 118], "sea": [28, 56, 108]}, "fronts": [{"id": "china", "title": "Japan grinds through China", "rank": "rank_china.png", "start": "1937-07-01", "end": "1937-11-30", "colour": "axis", "overlayPrefix": "overlays/china_", "stages": 64}, {"id": "poland", "title": "WW2 begins on 1 January 1939; the Axis smashes into Europe", "rank": "rank_poland.png", "start": "1939-01-01", "end": "1939-01-15", "colour": "axis", "overlayPrefix": "overlays/poland_", "stages": 64}, {"id": "west_europe", "title": "The rest of Europe collapses within the month", "rank": "rank_west_europe.png", "start": "1939-01-10", "end": "1939-01-31", "colour": "axis", "overlayPrefix": "overlays/west_europe_", "stages": 64}, {"id": "north_africa", "title": "German armour secures Suez and Egypt, then grinds through Africa", "rank": "rank_north_africa.png", "start": "1940-01-15", "end": "1941-03-27", "colour": "axis", "overlayPrefix": "overlays/north_africa_", "stages": 64, "maxStage": 40}, {"id": "soviet_union", "title": "Barbarossa launched 28 March 1941; key Soviet cities fall by June", "rank": "rank_soviet_union.png", "start": "1941-03-28", "end": "1941-06-30", "colour": "axis", "overlayPrefix": "overlays/soviet_union_", "stages": 64}], "rules": {"protectedVolunteerOnlyCountries": ["Saudi Arabia", "Portugal", "Spain", "Argentina", "Venezuela", "Sweden"], "barbarossaDefault": "Stop around the Moscow, Stalingrad, and Leningrad line unless the log explicitly says deeper conquest.", "finlandWinterWar": "Finland loses the Winter War but returns to the normal border rather than being annexed.", "africaDefault": "Axis gains in Africa should not flip protected volunteer-only neutral countries."}};
const DAY=24*60*60*1000; const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'); const buffer=document.createElement('canvas');buffer.width=metadata.width;buffer.height=metadata.height; const bctx=buffer.getContext('2d'); const statusBox=document.getElementById('status'); const slider=document.getElementById('slider'); const label=document.getElementById('label'); const playBtn=document.getElementById('play'); let dayStep=1, delay=85, playing=false, timer=null, isReady=false; let overlayCache={}; let baseImg=null; const startDay=parseDate(metadata.start), endDay=parseDate(metadata.end); let currentDay=startDay;
function parseDate(s){return Math.floor(new Date(s+'T00:00:00Z').getTime()/DAY);} function formatDay(d){return new Date(d*DAY).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});} function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function eventProgress(f,day){const a=parseDate(f.start), b=parseDate(f.end); if(day<a) return 0; if(day>=b) return 1; return (day-a)/Math.max(1,b-a);}
function captionFor(day){
  if(day < parseDate('1937-03-01')) return 'Standard pre-war build-up';
  if(day < parseDate('1938-01-01')) return 'Germany takes Anschluss and then submits the Czechs';
  if(day < parseDate('1939-01-01')) return 'Europe braces for an early war';

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawUI(c,day){c.save(); function panel(x,y,w,h){c.fillStyle='rgba(8,10,14,.84)';c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1;roundRect(c,x,y,w,h,16);c.fill();c.stroke();} panel(18,18,190,64); c.font='700 16px Arial'; c.fillStyle='rgba(195,195,195,.96)'; c.fillText('CURRENT DATE',30,37); c.font='900 24px Arial'; c.fillStyle='rgba(255,255,255,.98)'; c.fillText(formatDay(day),30,62); panel(1192,18,198,56); c.font='700 16px Arial'; c.fillStyle='rgba(195,195,195,.96)'; c.fillText('GAME DATE',1251,38); c.font='900 18px Arial'; c.fillStyle='rgba(255,255,255,.98)'; c.fillText(metadata.gameDate,1230,58); c.textAlign='center'; panel(220,18,946,38); c.font='800 18px Arial'; c.fillStyle='rgba(238,238,238,.98)'; c.fillText(captionFor(day),693,43); c.textAlign='left'; c.fillStyle='rgba(8,10,14,.7)'; c.strokeStyle='rgba(255,255,255,.12)'; roundRect(c,18,470,585,32,13); c.fill(); c.stroke(); c.font='900 14px Arial'; c.fillStyle='rgba(220,220,220,.95)'; c.fillText('Day-by-day sample · smooth preloaded overlay renderer',30,491); c.restore();}
function overlayPath(f,stage){return './assets/'+f.overlayPrefix+String(stage).padStart(3,'0')+'.png';}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('Failed to load '+src)); img.src=src;});}
async function loadAll(){ try{ baseImg=await loadImage('./assets/base_map.png'); let total=metadata.fronts.reduce((sum,f)=>sum+((f.maxStage??f.stages)+1),0), done=0; for(const f of metadata.fronts){ overlayCache[f.id]=[]; const maxStage=(f.maxStage??f.stages); for(let stage=0; stage<=maxStage; stage++){ overlayCache[f.id][stage]=await loadImage(overlayPath(f,stage)); done++; if(done%20===0) statusBox.textContent=`Preloading map overlays… ${done}/${total}`; } } isReady=true; statusBox.style.display='none'; slider.max=endDay-startDay; renderSync(); }catch(err){ console.error(err); statusBox.innerHTML='Map failed to load.<br><br>'+err.message; } }
function renderSync(){ if(!isReady) return; bctx.clearRect(0,0,metadata.width,metadata.height); bctx.drawImage(baseImg,0,0); for(const f of metadata.fronts){ const p=eventProgress(f,currentDay); if(p<=0) continue; const maxStage=(f.maxStage??f.stages); const stage=Math.max(0,Math.min(maxStage,Math.round(p*maxStage))); if(stage<=0) continue; const img=overlayCache[f.id][stage]; if(img) bctx.drawImage(img,0,0); } drawUI(bctx,currentDay); ctx.drawImage(buffer,0,0); slider.value=currentDay-startDay; label.textContent=formatDay(currentDay)+' · '+captionFor(currentDay); }
function tick(){ if(!playing) return; currentDay=clamp(currentDay+dayStep,startDay,endDay); renderSync(); if(currentDay>=endDay){ playing=false; playBtn.textContent='Play'; return; } timer=setTimeout(tick,delay); }
playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?'Pause':'Play'; if(playing) tick(); }; document.getElementById('back').onclick=()=>{ currentDay=clamp(currentDay-dayStep,startDay,endDay); renderSync(); }; document.getElementById('next').onclick=()=>{ currentDay=clamp(currentDay+dayStep,startDay,endDay); renderSync(); }; document.querySelectorAll('.speed').forEach(btn=>btn.onclick=()=>dayStep=Number(btn.dataset.step)); document.getElementById('slow').onclick=()=>delay=160; document.getElementById('fast').onclick=()=>delay=40; slider.oninput=e=>{ currentDay=startDay+Number(e.target.value); renderSync(); }; loadAll();
</script></body></html>
