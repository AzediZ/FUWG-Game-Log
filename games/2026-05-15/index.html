<!doctype html><html><head><meta charset="utf-8"><title>FUWG HOI4 Game Log — 15 May 2026</title><style>
:root{color-scheme:dark}body{margin:0;background:#05070c;color:#fff;font-family:Inter,Arial,sans-serif;display:flex;justify-content:center}.wrap{width:min(1500px,96vw);padding:18px 0}h1{font-size:24px;margin:0 0 8px}p{color:#b7bcc8;margin:0 0 12px;line-height:1.35}.viewer{position:relative;border:1px solid #2b3446;border-radius:18px;overflow:hidden;background:#04060a;box-shadow:0 18px 60px rgba(0,0,0,.55)}canvas{width:100%;display:block}.status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#04060a;color:#d1d5db;font-weight:800;text-align:center;padding:20px}.controls{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:#f3f4f6;color:#111}input[type=range]{flex:1;min-width:260px}.badge{background:#141820;border:1px solid #2b3446;padding:10px 12px;border-radius:12px;color:#e5e7eb;min-width:360px}</style></head><body><div class="wrap"><h1>FUWG / HOI4 — 15 May 2026</h1><p>Corrected day-by-day campaign recap.</p><div class="viewer"><canvas id="map" width="1408" height="512"></canvas><div id="status" class="status">Loading map assets…</div></div><div class="controls"><button id="play">Play</button><button id="back">-1d</button><button id="next">+1d</button><button class="speed" data-step="1">1d</button><button class="speed" data-step="3">3d</button><button class="speed" data-step="7">7d</button><button class="speed" data-step="30">30d</button><input id="slider" type="range" min="0" value="0"><span class="badge" id="label"></span><button id="slow">Slow</button><button id="fast">Fast</button></div></div>
<script>
const metadata={"width": 1408, "height": 512, "start": "1936-01-01", "end": "1941-06-30", "gameDate": "15/05/2026", "fronts": [{"id": "china", "overlayPrefix": "overlays/china_", "stages": 64, "segments": [["1937-07-01", "1937-11-30", 0, 64]]}, {"id": "poland", "overlayPrefix": "overlays/poland_", "stages": 64, "segments": [["1939-01-01", "1939-01-15", 0, 64]]}, {"id": "west_europe", "overlayPrefix": "overlays/west_europe_", "stages": 64, "segments": [["1939-01-10", "1939-01-31", 0, 64]]}, {"id": "finland", "overlayPrefix": "overlays/finland_", "stages": 64, "segments": [["1939-11-30", "1939-12-18", 0, 24], ["1939-12-18", "1940-03-13", 24, 0]]}, {"id": "africa_campaign", "overlayPrefix": "overlays/africa_campaign_", "stages": 64, "segments": [["1939-02-01", "1939-09-15", 0, 24], ["1939-10-01", "1940-06-01", 24, 48], ["1940-06-01", "1941-02-01", 48, 64]]}, {"id": "pacific_campaign", "overlayPrefix": "overlays/pacific_campaign_", "stages": 64, "segments": [["1941-01-10", "1941-03-01", 0, 32], ["1941-03-01", "1941-06-30", 32, 64]]}, {"id": "soviet_union", "overlayPrefix": "overlays/soviet_union_", "stages": 64, "segments": [["1941-03-28", "1941-06-30", 0, 32]]}]}; const DAY=24*60*60*1000; const canvas=document.getElementById('map'), ctx=canvas.getContext('2d'); const buffer=document.createElement('canvas'); buffer.width=metadata.width; buffer.height=metadata.height; const bctx=buffer.getContext('2d'); const statusBox=document.getElementById('status'), slider=document.getElementById('slider'), label=document.getElementById('label'), playBtn=document.getElementById('play'); let dayStep=1, delay=85, playing=false, isReady=false, overlayCache={}, baseImg=null; const startDay=parseDate(metadata.start), endDay=parseDate(metadata.end); let currentDay=startDay;
function parseDate(s){return Math.floor(new Date(s+'T00:00:00Z').getTime()/DAY);} function formatDay(d){return new Date(d*DAY).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});} function clamp(v,a,b){return Math.max(a,Math.min(b,v));} function lerp(a,b,t){return a+(b-a)*t;}
function frontStage(front, day){let stage=0; for(const seg of front.segments){const a=parseDate(seg[0]), b=parseDate(seg[1]), s0=seg[2], s1=seg[3]; if(day < a) return stage; if(day >= b) {stage=s1; continue;} const t=(day-a)/Math.max(1,b-a); return Math.round(lerp(s0,s1,t));} return stage;}
function captionFor(day){ if(day < parseDate('1937-03-01')) return 'Standard pre-war build-up'; if(day < parseDate('1938-01-01')) return 'Germany takes Anschluss in 1937 and then submits the Czechs'; if(day < parseDate('1939-01-01')) return 'Europe braces for the early war'; if(day <= parseDate('1939-01-31')) return 'WW2 begins on 1 January 1939 and Europe collapses in one month'; if(day < parseDate('1939-10-01')) return 'Axis pushes Egypt and drives down Africa toward South Africa'; if(day < parseDate('1941-01-10')) return 'West Africa falls late in 1939; the Axis is then pushed back up toward Ethiopia'; if(day < parseDate('1941-03-28')) return 'Japan declares in early 1941 and invades the Dutch East Indies and the Philippines'; if(day <= parseDate('1941-06-30')) return 'Japan reaches the India river line while Barbarossa takes the key Soviet cities'; return 'Axis victory'; }
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawUI(c,day){c.save(); function panel(x,y,w,h){c.fillStyle='rgba(8,10,14,.84)';c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1;roundRect(c,x,y,w,h,16);c.fill();c.stroke();} panel(18,18,190,64); c.font='700 16px Arial'; c.fillStyle='rgba(195,195,195,.96)'; c.fillText('CURRENT DATE',30,37); c.font='900 24px Arial'; c.fillStyle='rgba(255,255,255,.98)'; c.fillText(formatDay(day),30,62); panel(1192,18,198,56); c.font='700 16px Arial'; c.fillStyle='rgba(195,195,195,.96)'; c.fillText('GAME DATE',1251,38); c.font='900 18px Arial'; c.fillStyle='rgba(255,255,255,.98)'; c.fillText(metadata.gameDate,1230,58); c.textAlign='center'; panel(220,18,946,38); c.font='800 18px Arial'; c.fillStyle='rgba(238,238,238,.98)'; c.fillText(captionFor(day),693,43); c.textAlign='left'; c.restore();}
function overlayPath(f,stage){return './assets/'+f.overlayPrefix+String(stage).padStart(3,'0')+'.png';} function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('Failed to load '+src)); img.src=src;});}
async function loadAll(){ try{ baseImg=await loadImage('./assets/base_map.png'); let total=metadata.fronts.reduce((sum,f)=>sum+(f.stages+1),0), done=0; for(const f of metadata.fronts){ overlayCache[f.id]=[]; for(let stage=0; stage<=f.stages; stage++){ overlayCache[f.id][stage]=await loadImage(overlayPath(f,stage)); done++; if(done%25===0) statusBox.textContent=`Preloading map overlays… ${done}/${total}`; } } isReady=true; statusBox.style.display='none'; slider.max=endDay-startDay; renderSync(); }catch(err){ statusBox.innerHTML='Map failed to load.<br><br>'+err.message; console.error(err); } }
function renderSync(){ if(!isReady) return; bctx.clearRect(0,0,metadata.width,metadata.height); bctx.drawImage(baseImg,0,0); for(const f of metadata.fronts){ const stage=clamp(frontStage(f,currentDay),0,f.stages); if(stage>0){ const img=overlayCache[f.id][stage]; if(img) bctx.drawImage(img,0,0); } } drawUI(bctx,currentDay); ctx.drawImage(buffer,0,0); slider.value=currentDay-startDay; label.textContent=formatDay(currentDay)+' · '+captionFor(currentDay); }
function tick(){ if(!playing) return; currentDay=clamp(currentDay+dayStep,startDay,endDay); renderSync(); if(currentDay>=endDay){ playing=false; playBtn.textContent='Play'; return; } setTimeout(tick,delay); }
playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?'Pause':'Play'; if(playing) tick(); }; document.getElementById('back').onclick=()=>{ currentDay=clamp(currentDay-dayStep,startDay,endDay); renderSync(); }; document.getElementById('next').onclick=()=>{ currentDay=clamp(currentDay+dayStep,startDay,endDay); renderSync(); }; document.querySelectorAll('.speed').forEach(btn=>btn.onclick=()=>dayStep=Number(btn.dataset.step)); document.getElementById('slow').onclick=()=>delay=160; document.getElementById('fast').onclick=()=>delay=40; slider.oninput=e=>{ currentDay=startDay+Number(e.target.value); renderSync(); }; loadAll();
</script></body></html>
