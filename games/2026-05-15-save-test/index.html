<!doctype html><html><head><meta charset="utf-8"><title>HOI4 Save Test Animation</title><style>
body{margin:0;background:#06080d;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center}.wrap{width:min(1500px,96vw);padding:18px}h1{font-size:24px;margin:0 0 8px}p{color:#b8beca;margin:0 0 12px}.viewer{position:relative;border:1px solid #30384a;border-radius:16px;overflow:hidden;background:#04060a}canvas{width:100%;display:block}.controls{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}input{flex:1;min-width:260px}.badge{background:#151a22;border:1px solid #30384a;border-radius:10px;padding:10px 12px;min-width:360px}</style></head><body><div class="wrap"><h1>HOI4 Save-Scraper Test Run</h1><p>Quick animation built from the uploaded parser run. This only reached September 1936, so it is mostly a timeline/proof-of-capture package.</p><div class="viewer"><canvas id="c" width="1408" height="512"></canvas></div><div class="controls"><button id="play">Play</button><button id="prev">Prev</button><button id="next">Next</button><input id="slider" type="range" min="0" max="17" value="0"><span id="label" class="badge"></span></div></div><script>

20260515_212744", "game_date": "1936-9-5.11", "raw_game_date": "1936.9.5.11"}]; const img=new Image(); img.src='./assets/base_map.png'; const c=document.getElementById('c'),ctx=c.getContext('2d'),slider=document.getElementById('slider'),label=document.getElementById('label'),play=document.getElementById('play'); let i=0,playing=false;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,0,0);let s=shots[i]||{raw_game_date:'No snapshots'};ctx.fillStyle='rgba(8,10,14,.86)';rr(18,18,300,74,16);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.stroke();ctx.fillStyle='#cfd3dd';ctx.font='700 16px Arial';ctx.fillText('CURRENT SAVE SNAPSHOT',32,42);ctx.fillStyle='#fff';ctx.font='900 25px Arial';ctx.fillText(s.raw_game_date||'',32,70);ctx.fillStyle='rgba(8,10,14,.86)';rr(330,18,760,46,16);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='800 18px Arial';ctx.fillText('Captured from autosaves only — no major war/front movement yet',350,48);label.textContent=(i+1)+' / '+shots.length+' · '+(s.folder||'');slider.value=i;}
img.onload=draw; slider.oninput=e=>{i=Number(e.target.value);draw();}; document.getElementById('prev').onclick=()=>{i=Math.max(0,i-1);draw();};document.getElementById('next').onclick=()=>{i=Math.min(shots.length-1,i+1);draw();};play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play'; if(playing) tick();};function tick(){if(!playing)return;i=(i+1)%shots.length;draw();setTimeout(tick,550);}
</script></body></html>
