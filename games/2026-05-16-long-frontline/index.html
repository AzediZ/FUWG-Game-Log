<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOI4 FUWG Long Frontline</title><link rel="stylesheet" href="../../styles.css"></head>
<body>
<div class="shell">
  <a class="back" href="../../index.html">← Back to archive</a>
  <h1>HOI4 FUWG Long Frontline</h1>
  <p>217 parsed snapshots · pre-rendered smooth frontline transitions · parsed frames remain source of truth.</p>
  <div class="viewer">
    <video id="replay" preload="auto" playsinline poster="./assets/poster.png">
      <source src="./assets/frontline_smooth.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>
    <div class="titlebar">Smooth frontline replay</div>
    <div class="topbox"><small>GAME DATE</small><strong>16/05/2026</strong></div>
  </div>
  <div class="controls">
    <button id="play" class="primary">Play</button>
    <button id="restart">Restart</button>
    <button id="slow">Slow</button>
    <button id="normal">Normal</button>
    <button id="fast">Fast</button>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <span class="badge" id="speedLabel">Normal · 1.00x</span>
  </div>
  <div class="legend">
    <span class="pill"><span class="dot" style="background:#5a86cd"></span>Allies</span>
    <span class="pill"><span class="dot" style="background:#2b2b2d"></span>Axis</span>
    <span class="pill"><span class="dot" style="background:#bf3e3e"></span>Comintern</span>
    <span class="pill"><span class="dot" style="background:#846c3f"></span>GEACPS</span>
    <span class="pill"><span class="dot" style="background:#7a8088"></span>Neutral</span>
  </div>
</div>
<script>
const video = document.getElementById('replay');
const play = document.getElementById('play');
const restart = document.getElementById('restart');
const slow = document.getElementById('slow');
const normal = document.getElementById('normal');
const fast = document.getElementById('fast');
const scrub = document.getElementById('scrub');
const speedLabel = document.getElementById('speedLabel');
function setSpeed(label, rate) {
  video.playbackRate = rate;
  speedLabel.textContent = label + ' · ' + rate.toFixed(2) + 'x';
}
play.onclick = async () => {
  if (video.paused) {
    await video.play();
    play.textContent = 'Pause';
  } else {
    video.pause();
    play.textContent = 'Play';
  }
};
restart.onclick = () => { video.currentTime = 0; };
slow.onclick = () => setSpeed('Slow', 0.55);
normal.onclick = () => setSpeed('Normal', 1.00);
fast.onclick = () => setSpeed('Fast', 1.45);
video.addEventListener('pause', () => { if (video.ended || video.paused) play.textContent = 'Play'; });
video.addEventListener('play', () => { play.textContent = 'Pause'; });
video.addEventListener('timeupdate', () => {
  if (video.duration) scrub.value = Math.round((video.currentTime / video.duration) * 1000);
});
scrub.oninput = () => {
  if (video.duration) video.currentTime = (Number(scrub.value) / 1000) * video.duration;
};
setSpeed('Normal', 1.00);
</script>
</body></html>
