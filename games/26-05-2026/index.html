<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>26-05-2026</title><link rel="stylesheet" href="../../styles.css"></head><body><main class="shell"><a href="../../index.html">← Back to archive</a><h1>26-05-2026</h1><p>Province-based render. Land-only colouring; Iran/PER mapped to Comintern.</p><div class="viewer"><video id="video" src="assets/frontline_transition_normal.mp4" controls playsinline preload="metadata"></video></div><div class="controls"><button id="slow">Slow</button><button id="normal">Normal</button><button id="fast">Fast</button><span id="speedBox" class="badge">Speed: Normal</span></div></main><script>const video=document.getElementById('video');const speedBox=document.getElementById('speedBox');const variants={slow:{label:'Slow',src:'assets/frontline_transition_slow.mp4'},normal:{label:'Normal',src:'assets/frontline_transition_normal.mp4'},fast:{label:'Fast',src:'assets/frontline_transition_fast.mp4'}};let currentMode='normal';function setMode(mode){const v=variants[mode];if(!v||mode===currentMode)return;const wasPlaying=!video.paused;const ratio=(video.duration&&isFinite(video.duration))?video.currentTime/video.duration:0;currentMode=mode;speedBox.textContent='Speed: '+v.label;video.pause();video.src=v.src;video.load();video.addEventListener('loadedmetadata',function onMeta(){video.removeEventListener('loadedmetadata',onMeta);if(video.duration&&isFinite(video.duration))video.currentTime=Math.max(0,Math.min(video.duration-0.1,ratio*video.duration));if(wasPlaying)video.play().catch(()=>{});});}slow.onclick=()=>setMode('slow');normal.onclick=()=>setMode('normal');fast.onclick=()=>setMode('fast');</script></body></html>
