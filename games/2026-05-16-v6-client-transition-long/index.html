async function transitionTo(nextIdx){const my=++token, cur=idx, steps=5;statusBox.style.display='flex';statusBox.textContent='Loading transition…';const [a,b]=await Promise.all([getFrame(cur),getFrame(nextIdx)]);if(my!==token)return;const offA=document.createElement('canvas'),offB=document.createElement('canvas');offA.width=offB.width=canvas.width;offA.height=offB.height=canvas.height;const ca=offA.getContext('2d'),cb=offB.getContext('2d');ca.drawImage(a,0,0);cb.drawImage(b,0,0);const A=ca.getImageData(0,0,canvas.width,canvas.height),B=cb.getImageData(0,0,canvas.width,canvas.height);statusBox.style.display='none';for(let step=1;step<=steps;step++){if(my!==token)return;const t=1-Math.pow(1-step/(steps+1),1.45);const out=new ImageData(new Uint8ClampedArray(A.data),canvas.width,canvas.height);for(let y=0;y<canvas.height;y++){for(let x=0;x<canvas.width;x++){const p=(y*canvas.width+x)*4;const d=Math.abs(A.data[p]-B.data[p])+Math.abs(A.data[p+1]-B.data[p+1])+Math.abs(A.data[p+2]-B.data[p+2]);if(d>18){let edge=0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx>=0&&xx<canvas.width&&yy>=0&&yy<canvas.height){const q=(yy*canvas.width+xx)*4;const nd=Math.abs(A.data[q]-B.data[q])+Math.abs(A.data[q+1]-B.data[q+1])+Math.abs(A.data[q+2]-B.data[q+2]);if(nd<=18)edge++;}}const organic=(noise(x,y)-0.5)*0.18;const bias=edge?0.18:0;if(t+bias+organic>0.48){out.data[p]=B.data[p];out.data[p+1]=B.data[p+1];out.data[p+2]=B.data[p+2];out.data[p+3]=255;}}}ctx.putImageData(out,0,0);drawUI(metadata.snapshots[nextIdx],step,steps);label.textContent=metadata.snapshots[cur].display_date+' → '+metadata.snapshots[nextIdx].display_date+' · transition '+step+'/'+steps;await new Promise(r=>setTimeout(r,delay));}idx=nextIdx;await renderSnapshot(idx);}
async function nextAuto(){if(idx>=metadata.snapshotCount-1){playing=false;playBtn.textContent='Play';return;}const target=idx+1;if(metadata.snapshots[target].changedStates>0) await transitionTo(target); else {idx=target; await renderSnapshot(idx); await new Promise(r=>setTimeout(r,delay));}if(playing) nextAuto();}
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'Pause':'Play';if(playing)nextAuto();};document.getElementById('next').onclick=()=>{playing=false;playBtn.textContent='Play';transitionTo(Math.min(metadata.snapshotCount-1,idx+1));};document.getElementById('back').onclick=()=>{playing=false;playBtn.textContent='Play';idx=Math.max(0,idx-1);renderSnapshot(idx);};document.getElementById('slow').onclick=()=>delay=260;document.getElementById('fast').onclick=()=>delay=90;slider.oninput=e=>{playing=false;playBtn.textContent='Play';idx=Number(e.target.value);renderSnapshot(idx);};renderSnapshot(0);
</script></body></html>
