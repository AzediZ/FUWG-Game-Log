<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOI4 Games</title><link rel="stylesheet" href="styles.css"></head><body><header class="hero"><div class="shell"><div class="eyebrow">HOI4 Province Animator</div><h1>HOI4 Games</h1><p class="lead">Province-based parsed game logs.</p></div></header><main class="shell"><div id="gameGrid" class="grid"></div></main><footer class="footer"><div class="shell">Static GitHub Pages archive.</div></footer><script>async function load(){let games=[];try{games=await (await fetch('games/games.json',{cache:'no-store'})).json()}catch(e){}document.getElementById('gameGrid').innerHTML=games.map(g=>`<article class="card"><h2>${g.title||g.date}</h2><p>${g.description||''}</p><div class="meta"><span class="pill">${g.date}</span><span class="pill">${g.mod||'HOI4'}</span></div><a class="btn primary" href="${g.path}">Watch animation</a></article>`).join('')}</script></body></html>
