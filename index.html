<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HOI4 Province Game Logs</title>
  <style>
    body{margin:0;background:#111820;color:#e8edf2;font-family:system-ui,Segoe UI,Arial,sans-serif}
    main{max-width:980px;margin:0 auto;padding:32px}
    h1{font-size:28px;margin:0 0 18px}
    .card{background:#18222c;border:1px solid #263544;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 8px 28px rgba(0,0,0,.28)}
    a{color:#9ed0ff;text-decoration:none;font-weight:700}
    p{color:#b7c3cf}
  </style>
</head>
<body>
  <main>
    <h1>HOI4 Province Game Logs</h1>
    <p>Province-controller animations generated from parsed snapshots only.</p>
    <div id="games"></div>
  </main>
  <script>
    fetch('games/games.json').then(r=>r.json()).then(games=>{
      document.getElementById('games').innerHTML = games.map(g => `
        <div class="card">
          <a href="${g.path}">${g.title}</a>
          <p>${g.snapshots} snapshots · ${g.renderer}</p>
        </div>`).join('');
    });
  </script>
</body>
</html>
