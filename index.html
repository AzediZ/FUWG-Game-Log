<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HOI4 Games</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #172033 0, #070a10 46%, #030509 100%);
      color: #f8fafc;
      font-family: Inter, Arial, sans-serif;
    }
    .shell { width: min(1120px, 92vw); margin: 0 auto; }
    header { padding: 56px 0 28px; }
    .eyebrow { color: #93c5fd; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
    h1 { margin: 10px 0 12px; font-size: clamp(34px, 5vw, 62px); line-height: 1; }
    .lead { max-width: 720px; color: #cbd5e1; font-size: 18px; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; padding: 20px 0 60px; }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(15, 23, 42, .84);
      border: 1px solid rgba(148, 163, 184, .22);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,.38);
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: rgba(147,197,253,.66); background: rgba(20, 31, 53, .96); }
    .card h2 { margin: 0 0 10px; font-size: 24px; }
    .card p { margin: 0 0 18px; color: #cbd5e1; line-height: 1.45; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { background: rgba(30, 41, 59, .9); border: 1px solid rgba(148,163,184,.24); border-radius: 999px; padding: 7px 10px; font-size: 13px; color: #e2e8f0; }
    footer { color: #64748b; padding: 0 0 32px; font-size: 13px; }
  </style>
</head>
<body>
  <header class="shell">
    <div class="eyebrow">HOI4 Parsed Game Log Archive</div>
    <h1>HOI4 Games</h1>
    <p class="lead">Province-based animations generated from parsed controller snapshots.</p>
  </header>
  <main class="shell">
    <div id="gameGrid" class="grid"></div>
  </main>
  <footer class="shell">Static GitHub Pages archive · parsed data only</footer>
  <script>
    const fallbackGames = [{
      date: '23-05-2026-test',
      title: '23-05-2026 Test',
      description: 'Province-based no-border smooth predictive movement test render.',
      path: 'games/23-05-2026-test/index.html',
      mod: 'FUWG',
      status: 'Published'
    }];

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadGames() {
      let games = fallbackGames;
      try {
        const res = await fetch('games/games.json', { cache: 'no-store' });
        if (res.ok) {
          const parsed = await res.json();
          if (Array.isArray(parsed) && parsed.length) games = parsed;
        }
      } catch (err) {}

      document.getElementById('gameGrid').innerHTML = games.map(game => `
        <a class="card" href="${encodeURI(game.path)}">
          <h2>${escapeHtml(game.title || game.date)}</h2>
          <p>${escapeHtml(game.description || 'Animated parsed game log.')}</p>
          <div class="meta">
            <span class="pill">${escapeHtml(game.date || 'Unknown date')}</span>
            <span class="pill">${escapeHtml(game.mod || 'HOI4')}</span>
            <span class="pill">${escapeHtml(game.status || 'Available')}</span>
          </div>
        </a>
      `).join('');
    }
    loadGames();
  </script>
</body>
</html>
