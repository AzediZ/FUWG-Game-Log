<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOI4 Parsed Game Archive</title><style>body{margin:0;background:#070b12;color:#fff;font-family:Inter,Arial,sans-serif}.shell{max-width:1100px;margin:0 auto;padding:48px 24px}.card{background:#101722;border:1px solid #263244;border-radius:20px;padding:24px;margin-top:22px}.btn{display:inline-block;background:#f3f4f6;color:#111;padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:800}.muted{color:#aeb7c8}</style></head><body><div class="shell"><h1>HOI4 Parsed Game Archive</h1><p class="muted">Province-based parsed animations.</p><div id="games"></div></div><script>async function run(){let games=[{date:'23-05-2026',title:'23-05-2026',description:'Province-based smooth no-border render.',path:'games/23-05-2026/index.html'}];try{const r=await fetch('games/games.json',{cache:'no-store'});if(r.ok)games=await r.json()}catch(e){}document.getElementById('games').innerHTML=games.map(g=>`<div class="card"><h2>${g.title||g.date}</h2><p class="muted">${g.description||''}</p><a class="btn" href="${g.path}">Open animation</a></div>`).join('')}run()</script></body></html>
