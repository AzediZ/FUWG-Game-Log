<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOI4 Province Animator</title><style>body{background:#070b12;color:#fff;font-family:Arial,sans-serif;margin:0}.shell{max-width:1000px;margin:auto;padding:40px}a{color:#9cc3ff}.card{background:#111827;border:1px solid #263244;border-radius:18px;padding:20px;margin-top:20px}</style></head><body><div class="shell"><h1>HOI4 Province Animator</h1><p>Province-based GitHub Pages animation archive.</p><div id="games"></div></div><script>async function load(){let games=[];try{games=await (await fetch('games/games.json',{cache:'no-store'})).json()}catch(e){games=[{title:'22-05-2026',path:'games/22-05-2026/index.html',description:'Sample game'}]}document.getElementById('games').innerHTML=games.map(g=>`<div class="card"><h2>${g.title}</h2><p>${g.description||''}</p><a href="${g.path}">Open animation</a></div>`).join('')}load()</script></body></html>
