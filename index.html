<!doctype html><html lang='en'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width, initial-scale=1'/><title>HOI4 Parsed Save Archive</title><link rel='stylesheet' href='styles.css'/></head><body><header class='hero'><div class='shell'><div class='eyebrow'>HOI4 Parsed Game Log Archive</div><h1>Animated campaign recaps by game date.</h1><p class='lead'>Final tagfix build with corrected faction mapping for CHI, ARG, PRU, and CUB.</p><div class='actions'><a class='btn primary' href='#games'>View games</a> <a class='btn' href='games/2026-05-16-long-frontline-transition-video/index.html'>Open latest sample</a></div></div></header><main class='section' id='games'><div class='shell'><div class='section-head'><div><h2>Available game logs</h2><div class='muted'>Local fallback included.</div></div></div><div id='gameGrid' class='grid'></div></div></main><footer class='footer'><div class='shell'>Static GitHub Pages site · parsed save data renderer.</div></footer><script>const fallbackGames=[{date:'2026-05-16',title:'HOI4 FUWG Long Frontline',description:'Final tagfix build with corrected CHI/ARG/PRU/CUB faction colours.',path:'games/2026-05-16-long-frontline-transition-video/index.html',mod:'FUWG',status:'Published'}];async function loadGames(){const grid=document.getElementById('gameGrid');let games=fallbackGames;try{const res=await fetch('games/games.json',{cache:'no-store'});if(res.ok){games=await res.json();if(!Array.isArray(games)||!games.length)games=fallbackGames;}}catch(e){}grid.innerHTML=games.map(game=>`<article class='card'><h3>${escapeHtml(game.title||game.date)}</h3><p>${escapeHtml(game.description||'Animated game log recap.')}</p><div class='meta'><span class='pill'>${escapeHtml(game.date||'Unknown date')}</span><span class='pill'>${escapeHtml(game.mod||'HOI4')}</span><span class='pill'>${escapeHtml(game.status||'Available')}</span></div><a class='btn primary' href='${encodeURI(game.path)}'>Watch animation</a></article>`).join('');}function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}loadGames();</script></body></html>
