<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>HOI4 Parsed Save Archive</title><link rel="stylesheet" href="styles.css"/></head><body><header class="hero"><div class="shell"><div class="eyebrow">HOI4 Parsed Game Log Archive</div><h1>Animated campaign recaps by game date.</h1><p class="lead">Long-form parsed-save animation with smoother playback and no-blink frame loading.</p><div class="actions"><a class="btn primary" href="#games">View games</a> <a class="btn" href="games/2026-05-16-v6-client-transition-long/index.html">Open latest sample</a></div></div></header><main class="section" id="games"><div class="shell"><div class="section-head"><div><h2>Available game logs</h2><div class="muted">Works locally or on GitHub Pages.</div></div></div><div id="gameGrid" class="grid"></div></div></main><footer class="footer"><div class="shell">Static GitHub Pages site · parsed save data renderer.</div></footer><script>
const fallbackGames=[{"date": "2026-05-16", "title": "HOI4 FUWG Long Frontline", "description": "Parsed-save animation with smoother playback and no frame blinking.", "path": "games/2026-05-16-v6-client-transition-long/index.html", "mod": "FUWG", "status": "Published"}];
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function renderGames(games){const grid=document.getElementById('gameGrid');if(!games||!games.length){grid.innerHTML='<div class="empty">No game logs have been added yet.</div>';return;}grid.innerHTML=games.map(game=>`<article class="card"><h3>${escapeHtml(game.title||game.date)}</h3><p>${escapeHtml(game.description||'Animated game log recap.')}</p><div class="meta"><span class="pill">${escapeHtml(game.date||'Unknown date')}</span><span class="pill">${escapeHtml(game.mod||'HOI4')}</span><span class="pill">${escapeHtml(game.status||'Available')}</span></div><a class="btn primary" href="${game.path}">Watch animation</a></article>`).join('');}
async function loadGames(){try{const res=await fetch('games/games.json',{cache:'no-store'});if(!res.ok)throw new Error('fetch failed');renderGames(await res.json());}catch(e){renderGames(fallbackGames);}}
loadGames();
</script></body></html>
